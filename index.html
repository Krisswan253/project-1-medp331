<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last Transmission</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="scanlines"></div>

  <div class="container">

    <div class="top-bar">
      <h1>LAST TRANSMISSION</h1>
      <div class="top-right">
        <p>SIGNAL: WEAK</p>
        <button id="musicBtn">MUSIC: OFF</button>
      </div>
    </div>

    <!-- BOOT SCREEN -->
    <div id="bootScreen" class="boot-screen">
      <div class="boot-box">
        <p id="bootLine1" class="boot-line"></p>
        <p id="bootLine2" class="boot-line"></p>
        <p id="bootLine3" class="boot-line"></p>
        <p id="bootLine4" class="boot-line"></p>

        <button id="enterBtn" class="enter-btn hidden">ENTER TERMINAL</button>
      </div>
    </div>

    <!-- ARCHIVE SCREEN -->
    <div id="archiveScreen" class="archive-screen hidden">
      <div class="main-layout">

        <div class="right-panel">
          <div class="content-header">
            <h2>MEMORY ARCHIVE</h2>
            <p id="pageNumber">ENTRY 01 / 10</p>
          </div>

          <div class="content-box">
            <p id="storyText"></p>
          </div>

          <div class="memory-box">
            <p>MEMORY FRAGMENT:</p>
            <p>Use LEFT and RIGHT arrow keys to move through the archive.</p>
            <p>
              Hover to reveal:
              <span class="secret-text">something inside the archive is still awake</span>
            </p>
          </div>
        </div>

        <div class="signal-panel">
          <p class="signal-title">SIGNAL LEVEL</p>

          <div class="bars">
            <div class="signal-bar active-bar"></div>
            <div class="signal-bar"></div>
            <div class="signal-bar"></div>
            <div class="signal-bar"></div>
            <div class="signal-bar"></div>
          </div>

          <p class="small-text">CONNECTION UNSTABLE</p>
        </div>

      </div>
    </div>

  </div>

  <audio id="beepSound" src="assets/beep.mp3"></audio>
  <audio id="musicSound" src="assets/beep.mp3" loop></audio>

  <script src="script.js"></script>
</body>
</html>
